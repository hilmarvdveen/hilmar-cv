name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-cv-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the pnpm version from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: my-cv-site/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: my-cv-site/pnpm-lock.yaml

      - name: Install dependencies
        # The pnpm lockfile records optional platform binaries for every
        # platform, so a Windows-generated lockfile installs cleanly on the
        # Linux runner with a strict frozen install.
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Lint
        run: pnpm run lint

      - name: Test (with coverage gate)
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build
