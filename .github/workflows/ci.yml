name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-cv-site
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: my-cv-site/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: my-cv-site/pnpm-lock.yaml

      - name: Install dependencies
        # The pnpm lockfile records optional platform binaries for every
        # platform, so a Windows-generated lockfile installs cleanly on the
        # Linux runner with a strict frozen install.
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Test (with coverage gate)
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build
